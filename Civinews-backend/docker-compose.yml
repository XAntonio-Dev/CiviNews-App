services:
  db:
    image: postgres:15-alpine
    container_name: civinews_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: civinews
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    image: python:3.11-slim
    container_name: civinews_api
    restart: always
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    # Instalamos las librerías al vuelo y arrancamos con recarga automática 
    command: >
      bash -c "pip install -r requirements.txt && 
      uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      - db
  e2e-tests:
    image: python:3.11-slim
    container_name: civinews_tester
    working_dir: /app
    volumes:
      - .:/app
    environment:
      # Apuntamos directo al servicio interno de Docker. 
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
      - db
    # Instala dependencias y se queda despierto en segundo plano
    command: >
      bash -c "pip install -r requirements-test.txt && sleep infinity"

volumes:
  postgres_data:
